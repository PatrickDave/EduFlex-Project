org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX is required by the Android Gradle Plugin even when, as here, the app
# itself pulls in no AndroidX libraries at all.
android.useAndroidX=true

# This project deliberately has ZERO third-party dependencies. Nothing to
# shrink, nothing to resolve beyond the plugin itself. See README.md.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
